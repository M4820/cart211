<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
            
        }


        video {

            display: block; /*Places the video on its own line */
            width: 100%;/*Makes the video fill the available content width */
            aspect-ratio: 16/9; /*Sets a standard widescreen video ratio*/
            height: auto; /*allows the browser to calculate the height automatically*/
            background-color: rgb(57, 45, 192); /*Displays a  background while the video is loading*/

        }


    </style>

</head>
<body>
    
    <h1>Show Video</h1>
    <p>Video test</p>
    <video controls>

        <source src="videotest.mp4" type=video/mp4>

        Sorry, your browser cannot play this video.

    </video>


</body>
</html>
