<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background video</title>

    <style>

    /* remove the default spacing and makes the page fill the screen */

    * {

        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        color: white;
        background-color: black;
    }

    /* Positions the video behind the entire */
    .background-video{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;

        /*makes video behind the content*/
        z-index: -1;
    }

    /*adds a dark overlay to make the text easier to read*/
    .overlay {

        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        /*last value is opacity*/
        background-color: rgba(62, 65, 88, 0.4);
        z-index: 0;
    }


    .content {
        position: relative;
        z-index: 1;


        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    h1 {
        font-size: clamp(2rem, 5vw, 4rem);
        margin-bottom: 15px;
    }

    p {

        font-size: 1.2rem;
    }
    </style>

</head>
<body>
    
    <!-- BG video that plays automatically and repeats-->
    <video
    class="background-video"
    autoplay
    muted
    loop
    playsinLine
    aria-hidden="true"
    tabindex="-1">


<source src="videotest.mp4" type="video/mp4">
Your browser does not support background video.
</video>

<!--Darkens the bg video so that the text is visible-->
<div class="overlay"></div>

<main class="content">
<h1>video test</h1>
<p>test</p>

</main>

</body>
</html>
